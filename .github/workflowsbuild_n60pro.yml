name: Build ImmortalWrt N60 Pro
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: openwrt-24.10-6.6
      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure
        run: |
          cp defconfig/mt7986-ax6000.config .config
          sed -i 's/CONFIG_TARGET_DEVICE_mediatek_mt7986_DEVICE_xiaomi_redmi-router-ax6000=y/# CONFIG_TARGET_DEVICE_mediatek_mt7986_DEVICE_xiaomi_redmi-router-ax6000 is not set/' .config
          echo "CONFIG_TARGET_DEVICE_mediatek_mt7986_DEVICE_netcore_n60-pro=y" >> .config
          make defconfig
      - name: Build
        run: |
          make -j$(nproc) || make -j1 V=s
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-n60pro
          path: bin/targets/mediatek/filogic/*sysupgrade*
